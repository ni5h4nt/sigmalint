title: META001b positive - UUIDv4 string with trailing whitespace
# Python's UUID() does not strip whitespace; "  6ba9c5b1-...  " raises
# ValueError on parse and fires at ERROR. Useful regression guard
# against any future "lenient whitespace" workaround that would mask
# this defect.
id: "  6ba9c5b1-8f7e-4d2a-b5e1-1234567890ab  "
logsource:
    category: process_creation
detection:
    selection:
        Image|endswith: "\\powershell.exe"
    condition: selection
